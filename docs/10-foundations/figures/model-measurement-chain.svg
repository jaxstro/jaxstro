<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="title desc">
  <title id="title">A physical model and a measurement model are distinct maps</title>
  <desc id="desc">Parameters and state enter a physical model to produce an ideal observable. Calibration and selection enter a measurement operator. Model discrepancy and measurement error enter at different stages before recorded data.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#17233b}.box{fill:#f8fafc;stroke:#294a72;stroke-width:2}.physical{fill:#e7eef9;stroke:#294a72;stroke-width:2}.measure{fill:#e6f4f1;stroke:#14877c;stroke-width:2}.err{fill:#ede9fe;stroke:#6d5bd0;stroke-width:2}.arrow{stroke:#294a72;stroke-width:3;fill:none;marker-end:url(#a)}.label{font-size:20px;font-weight:650}.note{font-size:15px;fill:#536277}</style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="#294a72"/></marker></defs>
  <rect x="1" y="1" width="758" height="308" rx="18" fill="#ffffff" stroke="#dbe4f0"/>
  <rect x="25" y="122" width="115" height="64" rx="10" class="box"/><text x="82" y="149" text-anchor="middle" class="label">theta, s</text><text x="82" y="172" text-anchor="middle" class="note">source state</text>
  <path d="M140 154 H210" class="arrow"/><rect x="210" y="107" width="150" height="94" rx="12" class="physical"/><text x="285" y="143" text-anchor="middle" class="label">physical model</text><text x="285" y="169" text-anchor="middle" class="note">z = f(theta, s)</text><path d="M360 154 H430" class="arrow"/>
  <rect x="430" y="107" width="155" height="94" rx="12" class="measure"/><text x="507" y="143" text-anchor="middle" class="label">measurement map</text><text x="507" y="169" text-anchor="middle" class="note">h(z, eta)</text><path d="M585 154 H650" class="arrow"/><rect x="650" y="122" width="82" height="64" rx="10" class="box"/><text x="691" y="149" text-anchor="middle" class="label">d</text><text x="691" y="172" text-anchor="middle" class="note">recorded</text>
  <rect x="245" y="232" width="92" height="44" rx="9" class="err"/><text x="291" y="260" text-anchor="middle" class="note">delta: model gap</text><path d="M291 232 V202" class="arrow"/><rect x="465" y="32" width="87" height="44" rx="9" class="err"/><text x="508" y="60" text-anchor="middle" class="note">eta: calibration</text><path d="M508 76 V106" class="arrow"/><rect x="619" y="232" width="90" height="44" rx="9" class="err"/><text x="664" y="260" text-anchor="middle" class="note">epsilon: noise</text><path d="M664 232 V187" class="arrow"/>
</svg>
