<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="title desc">
  <title id="title">Independent and shared calibration errors predict different data clouds</title>
  <desc id="desc">The left panel shows circular independent-error contours for two measured channels. The right panel shows tilted contours caused by a shared calibration uncertainty. The observed point is the same in both panels.</desc>
  <style>text{font-family:system-ui,sans-serif;fill:#17233b}.axis{stroke:#536277;stroke-width:2}.ind{fill:#e6f4f1;stroke:#14877c;stroke-width:3}.corr{fill:#fce6df;stroke:#d65a45;stroke-width:3}.dot{fill:#17233b}.label{font-size:21px;font-weight:650}.note{font-size:16px;fill:#536277}</style>
  <text x="73" y="32" class="label">Independent errors</text><path d="M78 260 H330 M95 280 V65" class="axis"/><text x="288" y="285" class="note">channel 1</text><text x="48" y="75" class="note">channel 2</text><circle cx="210" cy="170" r="72" class="ind" opacity=".45"/><circle cx="210" cy="170" r="43" class="ind" opacity=".65"/><circle cx="210" cy="170" r="7" class="dot"/><text x="142" y="83" class="note">C diagonal</text>
  <text x="471" y="32" class="label">Shared calibration</text><path d="M455 260 H710 M472 280 V65" class="axis"/><text x="668" y="285" class="note">channel 1</text><text x="425" y="75" class="note">channel 2</text><ellipse cx="590" cy="170" rx="107" ry="45" transform="rotate(-35 590 170)" class="corr" opacity=".45"/><ellipse cx="590" cy="170" rx="62" ry="25" transform="rotate(-35 590 170)" class="corr" opacity=".65"/><circle cx="590" cy="170" r="7" class="dot"/><text x="520" y="83" class="note">C has covariance</text>
</svg>
