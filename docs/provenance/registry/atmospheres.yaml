# Source-backed atmosphere spectral products. Runtime enablement additionally
# requires the topology and interpolation gates in the spectra-v1 plan.
- id: newera-v3-lowres
  title: PHOENIX NewEra V3 low-resolution spectra
  summary: >-
    The NewEra low-resolution release provides wavelength-domain surface flux
    spectra in Gaia-compatible SI-density units that require an explicit CGS
    density conversion at the Jaxstro atmosphere boundary.
  scope: >-
    PHOENIX-NewEraV3-LowRes-SPECTRA products only; this card does not describe
    the HSR/LSR HDF5 arrays or Gaia/JWST products as interchangeable artifacts.
  conventions:
    - "owner=jaxstro.spectra"
    - "native_coordinate=wavelength_nm"
    - "native_density=F_lambda"
    - "native_unit=W m^-2 nm^-1"
    - "canonical_factor=1e10"
    - "canonical_unit=erg s^-1 cm^-2 cm^-1"
  sources:
    - reference: https://doi.org/10.1051/0004-6361/202554171
      locator: "Sect. 6, p. 7: low-resolution archive wavelengths and fluxes are nm and W m^-2 nm^-1; HDF5 fl is log10(F_lambda) in erg s^-1 cm^-2 cm^-1"
      supports: "the released coordinate, spectral-density meaning, and native units"
    - reference: https://www.fdr.uni-hamburg.de/record/17681
      locator: "Files table: PHOENIX-NewEraV3-LowRes-SPECTRA.tar.gz"
      supports: "the exact V3 low-resolution product identity"
  code_refs:
    - "src/jaxstro/atmospheres/newera.py::NewEraBackend"
  validation:
    - "tests/validation/provenance_cards/test_atmosphere_spectra_sources.py::test_newera_and_bosz_canonical_flux_conversions_are_explicit"
  status: verified
  deviations:
    - "The current backend preserves source values; the canonical 1e10 conversion is enforced by the spectra-v1 implementation gate before runtime enablement."

- id: bosz-2025-recomputed
  title: BOSZ 2025-recomputed 2024-format spectra
  summary: >-
    The recomputed BOSZ release distinguishes original-resolution Eddington
    first moment from lower-resolution files containing resampled flux and
    continuum values.
  scope: >-
    BOSZ files using the 2024 filename and product layout after the 2025-09-24
    recomputation; legacy BOSZ 2017 uses a different normalization convention.
  conventions:
    - "owner=jaxstro.spectra"
    - "native_coordinate=wavelength_angstrom"
    - "native_density=F_lambda_resampled"
    - "native_unit=erg s^-1 cm^-2 angstrom^-1"
    - "canonical_factor=1e8"
    - "original_resolution_conversion=F_lambda=4*pi*H_lambda"
  sources:
    - reference: https://archive.stsci.edu/hlsp/bosz
      locator: "2024 Version: original-resolution columns and F=4*pi*H; lower resolutions contain flux and continuum columns; update dated 2025-09-24"
      supports: "the product identity, native wavelength unit, flux convention, and recomputation status"
    - reference: https://doi.org/10.1051/0004-6361/202449306
      locator: "Sect. 3.3, equations and text describing original and resampled spectral products"
      supports: "the original H_lambda and lower-resolution flux-product distinction"
  code_refs:
    - "src/jaxstro/atmospheres/bosz.py::BoszBackend"
  validation:
    - "tests/validation/provenance_cards/test_atmosphere_spectra_sources.py::test_newera_and_bosz_canonical_flux_conversions_are_explicit"
  status: verified
  deviations:
    - "This card does not apply the BOSZ 2017 F=pi*H_BOSZ convention to the 2024-format products."

- id: sonora-diamondback-2024
  title: Sonora Diamondback 2024 spectra
  summary: >-
    Sonora Diamondback spectra provide monochromatic top-of-atmosphere radiation
    flux on a wavelength axis, with units per metre even though wavelengths are
    tabulated in microns.
  scope: >-
    The Diamondback spectra archive associated with Morley et al. (2024), not
    Sonora Bobcat, Cholla, Elf Owl, or reduced third-party copies.
  conventions:
    - "owner=jaxstro.spectra"
    - "native_coordinate=wavelength_micron"
    - "native_density=wavelength-density flux"
    - "native_unit=W m^-2 m^-1"
    - "canonical_factor=10"
    - "source_deviation=printed F_nu subscript conflicts with wavelength axis and per-metre density unit"
    - "sampling=monochromatic points; source warns against unresolved wavelength interpolation"
  sources:
    - reference: https://doi.org/10.5281/zenodo.12735103
      locator: "SPECTRA section: columns, units, F=4*pi*H statement, top-of-atmosphere meaning, and sampling warning"
      supports: "the coordinate, dimensional unit, surface-flux meaning, and point-sampling limitation"
    - reference: https://arxiv.org/abs/2402.00758
      locator: "Morley et al. (2024), model grid and published spectra description"
      supports: "the Diamondback family and parameter-domain identity"
  code_refs:
    - "src/jaxstro/atmospheres/sonora.py::parse_sonora_2024_filename"
  validation:
    - "tests/validation/provenance_cards/test_atmosphere_spectra_sources.py::test_sonora_source_inconsistency_and_conversion_are_explicit"
  status: verified
  deviations:
    - "Jaxstro follows the wavelength coordinate and per-metre dimensional unit, while recording the archive description's inconsistent nu subscript."

- id: tlusty-ostar2002
  title: TLUSTY OSTAR2002 spectral energy distributions
  summary: >-
    OSTAR2002 SED files tabulate frequency and surface Eddington flux H_nu; a
    physical surface flux requires the documented 4*pi factor before conversion
    from F_nu to canonical F_lambda.
  scope: >-
    OSTAR2002 full SED flux archives, not the separately published detailed UV
    or optical wavelength-domain products.
  conventions:
    - "owner=jaxstro.spectra"
    - "native_coordinate=frequency_hz"
    - "native_density=H_nu"
    - "native_unit=erg s^-1 cm^-2 Hz^-1"
    - "canonical_factor=4*pi then F_nu-to-F_lambda"
  sources:
    - reference: https://tlusty.oca.eu/tlusty/Tlusty2002/OS02-SED.html
      locator: "Spectral Energy Distributions: two-column archive format"
      supports: "frequency and surface H_nu column units"
    - reference: https://ui.adsabs.harvard.edu/abs/2003ApJS..146..417L/abstract
      locator: "Lanz & Hubeny (2003), Sect. 6 and footnote 6: stellar-surface flux F_nu=4*pi*H_nu"
      supports: "the Eddington-to-surface-flux conversion"
  code_refs:
    - "src/jaxstro/atmospheres/tlusty.py::parse_tlusty_flux_filename"
  validation:
    - "tests/validation/provenance_cards/test_atmosphere_spectra_sources.py::test_tlusty_eddington_flux_conversion_is_explicit"
  status: verified
  deviations:
    - "The processed artifact preserves H_nu; the spectra-v1 adapter owns the 4*pi and density-coordinate conversions."

