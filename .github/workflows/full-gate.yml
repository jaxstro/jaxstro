name: full gate

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAX_ENABLE_X64: "1"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  XLA_PYTHON_CLIENT_ALLOCATOR: platform
  OMP_NUM_THREADS: "1"

jobs:
  stage:
    name: ${{ matrix.stage }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        stage: [static, docs, tests-unit, tests-integration, tests-validation, extras, ml, distribution]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Record the runner CPU (XLA compiles for it)
        run: lscpu | grep -E 'Model name|Flags' | cut -c1-200
      - run: bash scripts/check.sh ${{ matrix.stage }}

  full-gate:
    if: always()
    needs: [stage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every stage succeeded
        run: |
          echo "stage=${{ needs.stage.result }}"
          test "${{ needs.stage.result }}" = "success"

  scientific-validation:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync pytest tests/validation -q
