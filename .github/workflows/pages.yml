# Build and deploy the MyST site at https://jaxstro.github.io/jaxstro/.
# Repository Settings -> Pages -> Source must be "GitHub Actions" before the
# first deployment. The workflow deliberately reuses the local documentation
# gate; it never publishes a build that bypassed route and rendered-DOM checks.

name: Deploy docs site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check_docs.sh"
      - "scripts/check_docs_site.py"
      - "scripts/inject_docs_accessibility.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

env:
  BASE_URL: /${{ github.event.repository.name }}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build MyST site (gate + HTML)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked documentation dependencies
        run: uv sync --locked --extra dev

      - name: Install pinned MyST
        run: npm install --global mystmd@1.10.1

      - name: Gate and build documentation
        run: bash scripts/check_docs.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
