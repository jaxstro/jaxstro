name: tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAX_ENABLE_X64: "1"
  XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  XLA_PYTHON_CLIENT_ALLOCATOR: platform
  OMP_NUM_THREADS: "1"

jobs:
  lock-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv lock --check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync ruff check src/ tests/
      - run: uv run --no-sync ruff format --check src/ tests/
      - run: uv run --no-sync mypy src/jaxstro

  fast-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev
      - run: >-
          uv run --no-sync pytest -q
          tests/unit/test_constants.py
          tests/unit/test_units.py
          tests/unit/test_coords.py
          tests/unit/test_numerics.py
          tests/unit/test_adr_workflow.py
          tests/unit/test_provenance_cards.py
          tests/validation/provenance_cards

  gradient-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync pytest tests/integration/test_grad_audit.py tests/validation/test_coords_grad_audit.py -q

  wheel-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv build --wheel -o dist/
      - name: Install wheel in a clean venv and import
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean/bin/python dist/*.whl
          /tmp/clean/bin/python -c "import jaxstro; print(jaxstro.__name__, 'imports clean')"

  tests:
    if: always()
    needs: [lock-check, lint, fast-tests, gradient-gate, wheel-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs succeeded
        run: |
          echo "lock-check=${{ needs.lock-check.result }} lint=${{ needs.lint.result }} fast-tests=${{ needs.fast-tests.result }} gradient-gate=${{ needs.gradient-gate.result }} wheel-smoke=${{ needs.wheel-smoke.result }}"
          if [ "${{ needs.lock-check.result }}" = "success" ] \
             && [ "${{ needs.lint.result }}" = "success" ] \
             && [ "${{ needs.fast-tests.result }}" = "success" ] \
             && [ "${{ needs.gradient-gate.result }}" = "success" ] \
             && [ "${{ needs.wheel-smoke.result }}" = "success" ]; then
            echo "all required jobs green"
          else
            echo "::error::a required job did not succeed"
            exit 1
          fi
